name: Bug Report
description: File a bug report
title: "[Bug]: <title>"
labels: ["Type: Bug"]
body:
- type: checkboxes
  attributes:
    label: Consent
    options:
    - label: I have searched the existing issues and verified that there is no open issue for the same subject.
      required: true
    - label: I understand that Pear Desktop Connector is a community project, unaffiliated with Elgato, Google, or YouTube.
      required: true
- type: textarea
  attributes:
    label: Current Behavior
    description: A concise description of what you're experiencing.
  validations:
    required: true
- type: textarea
  attributes:
    label: Expected Behavior
    description: A concise description of what you expected to happen.
  validations:
    required: true
- type: textarea
  attributes:
    label: Steps To Reproduce
    description: Steps to reproduce the behavior.
    placeholder: |
      1. Go to '...'
      2. Click on '....'
      3. Scroll down to '....'
      4. See error
  validations:
    required: true
- type: input
  attributes:
    label: OS
    description: "Which OS are you using?"
    placeholder: Windows, macOS, or Linux distribution
  validations:
    required: true
- type: input
  attributes:
    label: OS Version
    description: "Which OS version are you on?"
    placeholder: For example Windows 11 or macOS 13
  validations:
    required: true
- type: input
  attributes:
    label: Plugin Version
    description: "Which Version does your plugin has?"
    placeholder: v2.3.0 # x-release-please-version
  validations:
    required: true
- type: input
  attributes:
    label: Pear Desktop version and commit
    description: Include the commit if using the playlist API extension.
    placeholder: "3.12.0; feature/streamdeck-playlist-api at b5f13f6"
  validations:
    required: true
- type: input
  attributes:
    label: Stream Deck or OpenDeck version and device
    description: Include the host application, version, and device model.
    placeholder: Stream Deck 7.1, Stream Deck Plus; or OpenDeck 2.14.0
  validations:
    required: true
- type: dropdown
  attributes:
    label: How did you download the software?
    options:
      - GitHub CI artifact
      - Local build
      - Other
  validations:
    required: true
- type: textarea
  attributes:
    label: Anything else?
    description: |
      Links? References? Anything that will give us more context about the issue you are encountering!

      Include reproduction details and relevant errors. Remove authorization tokens, token-bearing URLs, and private playlist/account data before sharing logs or images.
  validations:
    required: false
