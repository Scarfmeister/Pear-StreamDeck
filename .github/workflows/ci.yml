name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - dev/pear-port

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Install Stream Deck CLI
        run: npm install -g @elgato/cli@1.10.1

      - name: Type-check plugin and tests
        run: npm run typecheck

      - name: Test client, actions, settings, browser integration, and localization
        run: npm test

      - name: Build plugin package
        run: npm run build

      - name: Prepare manifest for Stream Deck CLI
        run: npm run prepare:streamdeck-cli

      - name: Validate plugin package
        run: streamdeck validate --no-update-check build/io.github.scarfmeister.pear-streamdeck.sdPlugin

      - name: Pack plugin
        run: streamdeck pack --no-update-check build/io.github.scarfmeister.pear-streamdeck.sdPlugin --output build --force

      - name: Check distributable contents and Linux manifest view
        run: python3 scripts/validate-package.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamdeck-plugin
          path: build/io.github.scarfmeister.pear-streamdeck.streamDeckPlugin
